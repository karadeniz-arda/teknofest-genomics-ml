[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "teknofest-genomics-ml"
version = "0.1.0"
description = "Reproducible tabular genomics classification research pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "lightgbm==4.7.0",
    "catboost==1.2.10",
    "optuna==5.0.0",
    "joblib==1.6.0",
    "shap==0.52.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["teknofest_genomics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
